<fieldset class="border-0 p-0 m-0">
  <legend class="mb-3 text-lg font-semibold text-ink">Como você quer pagar?</legend>
  <div class="grid grid-cols-3 gap-2">
    @for (option of options; track option.id) {
      <label
        class="relative flex min-h-16 cursor-pointer flex-col items-start justify-center gap-1 rounded-xl border border-line bg-surface px-3 py-3 pr-8 text-left text-xs font-medium text-ink has-[:checked]:border-brand has-[:checked]:bg-brand-soft has-[:checked]:text-brand has-[:focus-visible]:outline has-[:focus-visible]:outline-2 has-[:focus-visible]:outline-offset-2 has-[:focus-visible]:outline-brand md:text-sm"
        [attr.for]="'method-' + option.id"
        (click)="selectMethod.emit(option.id)"
      >
        <input
          class="absolute top-2 right-2 size-4 accent-brand"
          type="radio"
          name="payment-method"
          [id]="'method-' + option.id"
          [value]="option.id"
          [checked]="method() === option.id"
        />
        @switch (option.id) {
          @case ('credit') {
            <svg lucideCreditCard [size]="18" aria-hidden="true"></svg>
          }
          @case ('debit') {
            <svg lucideWallet [size]="18" aria-hidden="true"></svg>
          }
          @case ('pix') {
            <img ngSrc="pix-mark.svg" width="18" height="18" alt="" class="size-[18px]" />
          }
        }
        {{ option.label }}
      </label>
    }
  </div>
</fieldset>
