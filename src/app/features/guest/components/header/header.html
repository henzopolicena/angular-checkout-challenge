<header class="flex justify-center border-b border-line bg-surface px-5 md:px-0">
  <div class="flex h-16 w-full max-w-chrome items-center justify-between md:h-[4.5rem]">
    <p class="flex items-center gap-2.5">
      <img ngSrc="nexo-mark.svg" width="32" height="32" alt="" priority class="size-8" />
      <span class="text-lg font-semibold tracking-tight text-ink">nexo</span>
    </p>
    <p class="flex items-center gap-1.5 text-xs font-medium text-brand md:text-sm">
      <svg lucideLock [size]="14" class="shrink-0 md:size-4" aria-hidden="true"></svg>
      <span>Checkout seguro</span>
    </p>
  </div>
</header>
